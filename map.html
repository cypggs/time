<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Global Time Map</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a192f; /* 深色背景 */
        }
        #world-map-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15; /* 半透明效果 */
        }
        .clock {
            position: absolute;
            text-align: center;
            transform: translate(-50%, -50%);
            min-width: 100px;
            color: #ccd6f6; /* 默认时间颜色 */
            text-shadow: 1px 1px 2px #000, -1px -1px 2px #000; /* 阴影避免文字被地图背景干扰 */
        }
        .back-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 15px;
            background: #64ffda;
            color: #0a192f;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
        }
        .city-name {
            font-weight: bold;
            color: #64ffda;
        }
        .time {
            font-size: 1.2em;
            color: #ccd6f6;
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="window.location.href='index.html'">← 返回主页</button>

    <!-- 内嵌 SVG 地图数据 -->
    <div id="world-map-container">

        </svg>
    </div>

    <script>
        // 城市数据（含坐标）
        const cities = [
            { name: "New York 🇺🇸 纽约", timezone: "America/New_York", coords: [40.7128, -74.0060] },
            { name: "London 🇬🇧 伦敦", timezone: "Europe/London", coords: [51.5074, -0.1278] },
            { name: "Tokyo 🇯🇵 东京", timezone: "Asia/Tokyo", coords: [35.6762, 139.6503] },
            { name: "Sydney 🇦🇺 悉尼", timezone: "Australia/Sydney", coords: [-33.8688, 151.2093] },
            { name: "Dubai 🇦🇪 迪拜", timezone: "Asia/Dubai", coords: [25.2048, 55.2708] },
            { name: "Beijing 🇨🇳 北京", timezone: "Asia/Shanghai", coords: [39.9042, 116.4074] },
            { name: "Rio de Janeiro 🇧🇷 里约", timezone: "America/Sao_Paulo", coords: [-22.9068, -43.1729] },
            { name: "Cape Town 🇿🇦 开普敦", timezone: "Africa/Johannesburg", coords: [-33.9249, 18.4241] },
            { name: "Moscow 🇷🇺 莫斯科", timezone: "Europe/Moscow", coords: [55.7558, 37.6173] },
            { name: "Toronto 🇨🇦 多伦多", timezone: "America/Toronto", coords: [43.6532, -79.3832] },
            { name: "Singapore 🇸🇬 新加坡", timezone: "Asia/Singapore", coords: [1.3521, 103.8198] },
            { name: "Auckland 🇳🇿 奥克兰", timezone: "Pacific/Auckland", coords: [-36.8485, 174.7633] }
        ];

        function updateClocks() {
            cities.forEach(city => {
                const options = {
                    timeZone: city.timezone,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                };
                const timeString = new Date().toLocaleTimeString('en-US', options);

                let clock = document.getElementById(`clock-${city.name}`);
                if (!clock) {
                    clock = document.createElement('div');
                    clock.className = 'clock';
                    clock.id = `clock-${city.name}`;
                    document.body.appendChild(clock);
                }

                // 转换为 SVG 坐标 (假设 viewBox="0 0 1000 667")
                const x = (city.coords[1] + 180) / 360 * 1000;
                const y = (90 - city.coords[0]) / 180 * 667;

                clock.style.left = `${x}px`;
                clock.style.top = `${y}px`;
                clock.innerHTML = `
                    <div class="city-name">${city.name}</div>
                    <div class="time">${timeString}</div>
                `;
            });
        }

        // 初始加载和定时更新
        updateClocks();
        setInterval(updateClocks, 1000);

        // 窗口大小变化时重定位 (SVG 坐标通常不需要重定位)
        // window.addEventListener('resize', updateClocks);
    </script>
</body>
</html>
