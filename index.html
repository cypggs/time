<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 原有head内容保持不变 -->
    <style>
        /* 新增全屏地图按钮样式 */
        #fullscreenMap {
            position: fixed;
            bottom: 20px;
            right: 120px;
            padding: 10px 15px;
            background: #ccd6f6;
            color: #0a192f;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s;
        }
        #fullscreenMap:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(204, 214, 246, 0.4);
        }
    </style>
</head>
<body>
    <!-- 原有body内容 -->
    
    <!-- 在原有地图模式按钮后添加 -->
    <button id="fullscreenMap">🗺️ 全屏地图</button>

    <script>
        // 新增跳转逻辑
        document.getElementById('fullscreenMap').addEventListener('click', () => {
            window.location.href = 'map.html';
        });
    </script>
</body>
</html>
